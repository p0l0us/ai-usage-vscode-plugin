name: Test

on:
  push:
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Builds, runs the suite under V8 coverage and enforces coverage-thresholds.json.
      - run: npm run coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcov
          path: coverage/lcov.info
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: xvfb-run -a npm run test:e2e
